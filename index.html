<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Student Information Card Generator</h1>

    <div class="main-container">
        <div class="form-container">
            <label for="name">Student Name:</label>
            <input type="text" id="name" placeholder="Enter Your Name">

            <label for="roll">Roll No.:</label>
            <input type="text" id="roll" placeholder="Enter Your Roll Number">

            <label for="email">Student Email:</label>
            <input type="email" id="email" placeholder="Enter Your Email">

            <label for="age">Age:</label>
            <input type="number" id="age" placeholder="Enter Your Age">

            <label for="gender">Gender</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Male">Male</label>
                <label><input type="radio" name="gender" value="Female">Female</label>
            </div>

            <label for="courses">Courses:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="Web" value="Web">Web Development</label>
                <label><input type="checkbox" name="Data Science" value="Data Science">Data Science</label>
            </div>
            <label for="marks">Marks:</label>
            <span id="marksValue">50</span>/100
            <input type="range" id="marks" min="0" max="100" value="50">

            <label for="photo">Upload Photo:</label>
            <input type="file" id="photo" accept="image/*">
            <button id="generateBtn">Generate Card</button>
        </div>

        <!-- Card Display -->
        <div class="card-container">
            <div class="student-card" id="studentCard">
                <img class="studentPhoto" src="https://picsum.photos/200" alt="Student Photo" id="cardImage">
                <h2 id="cardName">Student Name</h2>
                <p id="cardRoll">Roll No.: </p>
                <p id="cardEmail">Email: </p>
                <p id="cardAge">Age: </p>
                <p id="cardGender">Gender: </p>
                <p id="cardCourses">Courses: </p>
                <p id="cardMarks">Marks: </p>
            </div>
        </div>
    </div>



    <script src="./script.js"></script>
</body>

</html>
